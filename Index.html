<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intranet — Connexion</title>

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Feuille de style -->
  <link rel="stylesheet" href="../CSS/login.css" />
</head>
<body>

  <!-- Fond animé (halos de dégradé très discrets) -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora__blob aurora__blob--one"></span>
    <span class="aurora__blob aurora__blob--two"></span>
    <span class="aurora__blob aurora__blob--three"></span>
  </div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Bouton de thème -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Changer de thème">
    <span class="theme-toggle__track">
      <span class="theme-toggle__thumb">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2.5V5M12 19v2.5M4.6 4.6L6.4 6.4M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </span>
    </span>
  </button>

  <main class="page">
    <section class="card" role="main">

      <!-- En-tête / marque -->
      <header class="card__header">
        <div class="brand">
          <span class="brand__mark">
            <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
              <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#brandGrad)"/>
              <path d="M10.5 20.5V11.5L16 15.2 10.5 20.5Z" fill="white" opacity="0.95"/>
              <path d="M16 15.2 21.5 11.5V20.5L16 15.2Z" fill="white" opacity="0.55"/>
              <defs>
                <linearGradient id="brandGrad" x1="1" y1="1" x2="31" y2="31" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#5B5FEF"/>
                  <stop offset="1" stop-color="#8B7CF6"/>
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="brand__name">Intranet</span>
        </div>
        <h1 class="card__title" id="form-title">Content de vous revoir</h1>
        <p class="card__subtitle" id="form-subtitle">Connectez-vous pour accéder à votre espace</p>
      </header>

      <!-- Bascule Connexion / Inscription -->
      <div class="tabs" role="tablist" aria-label="Choix du formulaire">
        <button class="tabs__btn is-active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login" type="button">
          Connexion
        </button>
        <button class="tabs__btn" id="tab-register" role="tab" aria-selected="false" aria-controls="panel-register" type="button">
          Inscription
        </button>
        <span class="tabs__indicator" aria-hidden="true"></span>
      </div>

      <!-- Bouton Discord -->
      <button id="discord-login" class="btn btn--discord" type="button">
        <svg class="discord-icon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path fill="currentColor" d="M20.3 5.4a17.7 17.7 0 0 0-4.4-1.4l-.2.4a15.9 15.9 0 0 0-1.4 0 12 12 0 0 0-3.9 0 15.9 15.9 0 0 0-1.4 0l-.2-.4a17.6 17.6 0 0 0-4.4 1.4C1.6 9 .9 12.5 1.2 16a17.9 17.9 0 0 0 5.4 2.7c.4-.6.8-1.2 1.1-1.9a11.5 11.5 0 0 1-1.8-.9l.4-.3a12.7 12.7 0 0 0 10.9 0l.4.3a11.5 11.5 0 0 1-1.8.9c.3.7.7 1.3 1.1 1.9A17.9 17.9 0 0 0 22.8 16c.4-4.1-.7-7.6-2.5-10.6ZM8.7 13.9c-.8 0-1.5-.8-1.5-1.7 0-1 .6-1.7 1.5-1.7s1.5.8 1.5 1.7-.7 1.7-1.5 1.7Zm6.6 0c-.8 0-1.5-.8-1.5-1.7 0-1 .6-1.7 1.5-1.7s1.5.8 1.5 1.7-.6 1.7-1.5 1.7Z"/>
        </svg>
        <span>Continuer avec Discord</span>
      </button>

      <div class="divider"><span>ou</span></div>

      <!-- ============ FORMULAIRE : CONNEXION ============ -->
      <form id="panel-login" class="panel is-active" role="tabpanel" aria-labelledby="tab-login" novalidate>

        <div class="field">
          <label for="login-identifier">Adresse e-mail ou pseudo</label>
          <div class="field__control">
            <input type="text" id="login-identifier" name="identifier" autocomplete="username" placeholder="ex. clara@mail.com" />
          </div>
          <p class="field__error" data-error-for="login-identifier"></p>
        </div>

        <div class="field">
          <label for="login-password">Mot de passe</label>
          <div class="field__control">
            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="field__toggle-visibility" data-target="login-password" aria-label="Afficher le mot de passe">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
          <p class="field__error" data-error-for="login-password"></p>
        </div>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" id="remember-me" name="remember" />
            <span class="checkbox__box" aria-hidden="true"></span>
            <span class="checkbox__label">Se souvenir de moi</span>
          </label>
          <a href="#" id="forgot-password" class="link-subtle">Mot de passe oublié ?</a>
        </div>

        <p class="form-message" id="login-message" role="alert"></p>

        <button type="submit" class="btn btn--primary">
          <span>Se connecter</span>
        </button>
      </form>

      <!-- ============ FORMULAIRE : INSCRIPTION ============ -->
      <form id="panel-register" class="panel" role="tabpanel" aria-labelledby="tab-register" novalidate>

        <div class="field">
          <label for="register-username">Pseudo</label>
          <div class="field__control">
            <input type="text" id="register-username" name="username" autocomplete="nickname" placeholder="ex. Clara" />
          </div>
          <p class="field__error" data-error-for="register-username"></p>
        </div>

        <div class="field">
          <label for="register-email">Adresse e-mail</label>
          <div class="field__control">
            <input type="email" id="register-email" name="email" autocomplete="email" placeholder="ex. clara@mail.com" />
          </div>
          <p class="field__error" data-error-for="register-email"></p>
        </div>

        <div class="field">
          <label for="register-password">Mot de passe</label>
          <div class="field__control">
            <input type="password" id="register-password" name="password" autocomplete="new-password" placeholder="8 caractères minimum" />
            <button type="button" class="field__toggle-visibility" data-target="register-password" aria-label="Afficher le mot de passe">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
          <p class="field__error" data-error-for="register-password"></p>
        </div>

        <div class="field">
          <label for="register-confirm">Confirmation du mot de passe</label>
          <div class="field__control">
            <input type="password" id="register-confirm" name="confirm" autocomplete="new-password" placeholder="••••••••" />
            <button type="button" class="field__toggle-visibility" data-target="register-confirm" aria-label="Afficher le mot de passe">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
          <p class="field__error" data-error-for="register-confirm"></p>
        </div>

        <p class="form-message" id="register-message" role="alert"></p>

        <button type="submit" class="btn btn--primary">
          <span>Créer mon compte</span>
        </button>
      </form>

      <p class="card__footer">
        <span id="footer-login-text">Pas encore de compte ?
          <button type="button" class="link-strong" id="switch-to-register">Créer un compte</button>
        </span>
        <span id="footer-register-text" hidden>Déjà inscrit ?
          <button type="button" class="link-strong" id="switch-to-login">Se connecter</button>
        </span>
      </p>

    </section>
  </main>

  <!-- Script -->
  <script src="../JS/login.js"></script>
</body>
</html>
