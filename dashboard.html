<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intranet — Tableau de bord</title>

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Feuille de style -->
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- Fond : halo conique animé + grille de points -->
  <div class="halo" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <div class="dashboard-layout">
    
    <!-- Barre latérale -->
    <aside class="sidebar card" role="navigation">
      <header class="brand">
        <span class="brand__mark">
          <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#brandGrad)"/>
            <path d="M10.5 20.5V11.5L16 15.2 10.5 20.5Z" fill="white" opacity="0.95"/>
            <path d="M16 15.2 21.5 11.5V20.5L16 15.2Z" fill="white" opacity="0.55"/>
            <defs>
              <linearGradient id="brandGrad" x1="1" y1="1" x2="31" y2="31" gradientUnits="userSpaceOnUse">
                <stop stop-color="#5B5FEF"/>
                <stop offset="1" stop-color="#8B7CF6"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand__name">Intranet</span>
      </header>

      <nav class="sidebar__nav">
        <a href="#" class="sidebar__link is-active">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Vue d'ensemble
        </a>
        <a href="#" class="sidebar__link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          Serveur
        </a>
      </nav>
    </aside>

    <!-- Zone principale -->
    <main class="main-content">
      
      <!-- En-tête -->
      <header class="topbar card">
        <div>
          <h1 class="card__title" id="welcome-title">Chargement...</h1>
          <p class="card__subtitle">Bienvenue sur votre espace sécurisé.</p>
        </div>
        
        <div class="topbar__actions">
          <!-- Bouton de thème -->
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Changer de thème">
            <span class="theme-toggle__track">
              <span class="theme-toggle__thumb">
                <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5V5M12 19v2.5M4.6 4.6L6.4 6.4M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              </span>
            </span>
          </button>
          
          <!-- NOUVEAU : Menu Utilisateur Cliquable -->
          <div class="user-menu-container">
            <button class="user-profile-btn" id="user-menu-btn" aria-expanded="false">
              <span class="user-avatar" id="user-initial">?</span>
              <span class="user-name" id="user-name-display">Chargement...</span>
              <svg class="icon-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            
            <div class="user-dropdown" id="user-dropdown">
              <div class="dropdown-header">
                <p class="dropdown-name" id="dropdown-name">Utilisateur</p>
                <p class="dropdown-role">Membre Intranet</p>
              </div>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item">Mon Profil</a>
              <a href="#" class="dropdown-item">Paramètres</a>
              <div class="dropdown-divider"></div>
              <button id="btn-logout" class="dropdown-item text-danger">Déconnexion</button>
            </div>
          </div>

        </div>
      </header>

      <!-- Grille de statistiques -->
      <section class="stats-grid">
        <div class="stat-card card">
          <h3>Statut du compte</h3>
          <div class="stat-value text-success">Actif & Sécurisé</div>
        </div>
        <div class="stat-card card">
          <h3>Authentification</h3>
          <div class="stat-value text-accent">Firebase Auth</div>
        </div>
        <div class="stat-card card">
          <h3>Rôle Discord</h3>
          <div class="stat-value">Membre</div>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
